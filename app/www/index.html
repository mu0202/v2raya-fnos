<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>v2rayA · 飞牛 fnOS</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }
    main { max-width: 560px; width: 100%; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 32px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 12px 32px rgba(16, 24, 40, .08);
    }
    h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: .2px; }
    .sub { margin: 0 0 20px; color: #667085; font-size: 14px; }
    a.btn {
      display: inline-block;
      background: #1f6feb;
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
    }
    code {
      background: #f1f5f9;
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 13px;
    }
    ul { padding-left: 20px; margin: 14px 0 0; }
    li { margin: 6px 0; font-size: 14px; color: #475467; line-height: 1.6; }
    .note {
      margin-top: 20px;
      padding: 12px 14px;
      background: #fff8e6;
      border: 1px solid #f5d98b;
      border-radius: 10px;
      font-size: 13px;
      color: #6b5300;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>v2rayA 已在运行</h1>
      <p class="sub">飞牛 fnOS 适配版 · 通过系统统一网关访问</p>

      <a class="btn" href="/app/v2raya/">打开 v2rayA 管理界面</a>

      <ul>
        <li>请从<strong>飞牛桌面图标</strong>打开，或点击上方按钮。</li>
        <li>本应用通过 Unix Socket 与系统网关通信，不额外监听 TCP 端口。</li>
        <li>首次打开时在页面内创建管理员账户。</li>
      </ul>

      <div class="note">
        本应用以 <strong>root 运行</strong>，因此<strong>支持透明代理与 TUN 模式</strong>
        （TUN 需要 CAP_NET_ADMIN 与 <code>/dev/net/tun</code>）。
        同时提供完整的 Web 界面、节点/订阅管理，以及 SOCKS5 / HTTP 代理入站。
      </div>
    </div>
  </main>
</body>
</html>
